name: Release

# Every push to main that passes CI and changes the app becomes a release: the next patch version
# (or package.json's version if you raised it), notes from the commits (or that version's
# CHANGELOG section), and installers for Linux, macOS and Windows. Installed copies see it within
# 15 minutes and offer the update.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if the app didn't change since the last release
        type: boolean
        default: false

# Read-only by default; the jobs that create, fill and publish the release get write access below.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, foundry]
    timeout-minutes: 30
    permissions:
      contents: write # creates the draft release (and deletes a stale one)
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes with git
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Decide the version and draft the release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse HEAD)
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$FORCE" != "true" ] && git diff --quiet "$latest" HEAD -- \
              src data build package.json pnpm-lock.yaml electron-builder.yml electron.vite.config.ts; then
            echo "The app hasn't changed since $latest; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node --no-warnings scripts/next-version.mjs "${latest:-v0.0.0}")
          # a draft left by a failed run of the same version is replaced, not reused (its assets may be stale)
          if gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v$version" --yes
          fi
          node --no-warnings scripts/release-notes.mjs "$version" "$latest" > notes.md
          cat notes.md
          gh release create "v$version" --draft --target "$sha" --title "RepoDeck $version" --notes-file notes.md
          {
            echo "release=true"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    if: needs.draft.outputs.release == 'true'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on Foundry's self-hosted runner; macOS and Windows need GitHub's runners.
        include:
          - platform: linux
            runner: [self-hosted, foundry]
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # electron-builder uploads the installers to the draft
    defaults:
      run:
        shell: bash # the same quoting everywhere (PowerShell splits -c.extraMetadata.version=…)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build installers and upload them to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # macOS builds are unsigned
        run: pnpm exec electron-builder --publish always -c.extraMetadata.version=${{ needs.draft.outputs.version }}

  publish:
    needs: [draft, build]
    runs-on: [self-hosted, foundry]
    timeout-minutes: 30
    permissions:
      contents: write # publishes the draft
    steps:
      - name: Publish the release (installed copies pick it up from here)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.draft.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
